<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>Page not found — The Access Audit</title>
<meta name="robots" content="noindex">
<style>
  :root { --ink:#16181d; --muted:#5b6472; --accent:#1d4ed8; --bg:#fff }
  @media (prefers-color-scheme: dark) { :root { --ink:#e8eaee; --muted:#9aa3b2; --bg:#101216; --accent:#4d7ef7 } }
  * { box-sizing:border-box; margin:0 }
  body { font:17px/1.65 -apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:var(--bg);
         min-height:100vh; display:grid; place-items:center; padding:1.25rem }
  main { max-width:34rem; text-align:center }
  h1 { font-size:2rem; letter-spacing:-.02em; margin-bottom:.75rem }
  p { color:var(--muted); margin-bottom:1.5rem }
  a.btn { display:inline-block; background:var(--accent); color:#fff; padding:.7rem 1.4rem;
          border-radius:10px; text-decoration:none; font-weight:600 }
</style>
</head>
<body>
<main>
  <h1>That page doesn't exist</h1>
  <p>Ironically, broken links are WCAG-adjacent — this one is ours, and we'd rather show you
  the pages that work.</p>
  <a class="btn" href="/">Back to The Access Audit</a>
</main>
</body>
</html>
