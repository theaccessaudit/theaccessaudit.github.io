<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'">
<title>Page not found — The Access Audit</title>
<meta name="robots" content="noindex">
<style>
/* Newsreader — SIL Open Font License 1.1. See fonts/LICENSE-Newsreader.txt.
   Absolute paths throughout: a 404 is served for /anything/at/any/depth, and
   the browser resolves relative URLs against THAT path, not against the root. */
@font-face {
  font-family: "Newsreader";
  src: url("/fonts/newsreader.woff2") format("woff2");
  font-weight: 400 600; font-style: normal; font-display: swap;
}
:root {
  color-scheme: light;
  --paper:#fbfaf7; --surface:#ffffff;
  --ink:#14161a; --ink-2:#4a5058;
  --rule:#e2ded6; --rule-firm:#cbc6bb;
  --accent:#17408f; --accent-hi:#0f2f6d; --on-accent:#ffffff;
  --s2:.5rem; --s3:.75rem; --s4:1rem; --s5:1.5rem; --s6:2rem; --s7:3rem;
  --step--1: clamp(.82rem, .79rem + .13vw, .89rem);
  --step-0:  clamp(1.0625rem, 1.03rem + .17vw, 1.15rem);
  --step-1:  clamp(1.25rem, 1.18rem + .33vw, 1.45rem);
  --step-3:  clamp(2.1rem, 1.75rem + 1.7vw, 3.35rem);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --paper:#0f1114; --surface:#16191e;
    --ink:#eceef1; --ink-2:#b3bac4;
    --rule:#272c34; --rule-firm:#3a414b;
    --accent:#9dbaff; --accent-hi:#c3d3ff; --on-accent:#0b0e13;
  }
}
*, *::before, *::after { box-sizing: border-box }
* { margin: 0 }
html { -webkit-text-size-adjust: 100% }
body {
  background: var(--paper); color: var(--ink);
  font: var(--step-0)/1.62 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-synthesis-weight: none; text-rendering: optimizeLegibility;
  min-height: 100vh; display: flex; flex-direction: column;
}
::selection { background: var(--accent); color: var(--on-accent) }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 2px }
a { color: var(--accent); text-underline-offset: .18em }
.shell { max-width: 68rem; margin-inline: auto; padding-inline: var(--s5); width: 100% }
.masthead { border-bottom: 1px solid var(--rule); padding-block: var(--s5) }
.masthead .shell { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s5); align-items: baseline }
.wordmark {
  font-family: "Newsreader", ui-serif, Georgia, serif;
  font-size: var(--step-1); font-weight: 600; letter-spacing: -.02em;
  color: var(--ink); text-decoration: none;
}
.masthead p { color: var(--ink-2); font-size: var(--step--1) }
main { flex: 1; display: flex; align-items: center; padding-block: var(--s7) }
h1 {
  font-family: "Newsreader", ui-serif, Georgia, "Times New Roman", serif;
  font-size: var(--step-3); font-weight: 600; letter-spacing: -.028em;
  line-height: 1.12; text-wrap: balance; max-width: 16ch;
}
main p { margin-top: var(--s5); color: var(--ink-2); max-width: 54ch; text-wrap: pretty }
.actions { margin-top: var(--s6); display: flex; flex-wrap: wrap; gap: var(--s4) }
.btn {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 2.875rem; padding: var(--s3) var(--s5);
  border-radius: 8px; border: 1px solid transparent;
  background: var(--accent); color: var(--on-accent);
  font-weight: 600; font-size: var(--step-0); text-decoration: none;
  transition: background-color .15s ease;
}
.btn:hover { background: var(--accent-hi); color: var(--on-accent) }
.btn.ghost { background: transparent; color: var(--accent); border-color: var(--rule-firm) }
.btn.ghost:hover { background: transparent; border-color: var(--accent); color: var(--accent-hi) }
@media (prefers-reduced-motion: reduce) { .btn { transition: none } }
</style>
</head>
<body>

<header class="masthead">
  <div class="shell">
    <a class="wordmark" href="/">The Access Audit</a>
    <p>Independent WCAG 2.1 AA testing — Aaron Siebold</p>
  </div>
</header>

<main>
  <div class="shell">
    <h1>That page doesn&rsquo;t exist.</h1>
    <p>A broken link is the kind of thing an audit catches, and this one is ours. The pages that
    do work are one click away.</p>
    <div class="actions">
      <a class="btn" href="/">Back to the home page</a>
      <a class="btn ghost" href="/sample-report.html">Read a real report</a>
    </div>
  </div>
</main>

</body>
</html>
